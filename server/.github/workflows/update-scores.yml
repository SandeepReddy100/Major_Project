name: Update Scores

on:
  schedule:
    - cron: "0 0 */2 * *"   # every 2 days at 00:00 UTC
  workflow_dispatch:

jobs:
  call-update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Call Update Scores API
        run: |
          echo "Calling Update Scores API..."
          status=$(curl -s -o response.txt -w "%{http_code}" "${{ secrets.UPDATE_SCORES_URL }}")
          echo "----- response body -----"
          cat response.txt || true
          echo "----- end response body -----"
          echo "HTTP status: $status"
          if [ "$status" -ne 200 ]; then
            echo "❌ Update Scores API call failed"
            exit 1
          fi
